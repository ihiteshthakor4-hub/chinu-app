<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CHINU OS v2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <span class="dot"></span>
                <span>CHINU OS <small>v2.0</small></span>
            </div>
            <div class="clock-box">
                <div id="time">00:00:00</div>
                <div id="date">LOADING...</div>
            </div>
        </div>

        <!-- Status Cards -->
        <div class="stats">
            <div class="card">
                <div class="label">BATTERY</div>
                <div id="battery" class="val">--%</div>
            </div>
            <div class="card">
                <div class="label">NETWORK</div>
                <div class="val green">ONLINE</div>
            </div>
            <div class="card">
                <div class="label">VOICE CORE</div>
                <div class="val">FEMALE</div>
            </div>
        </div>

        <!-- Center Siri / CHINU Orb -->
        <div class="orb-section">
            <div id="orb" class="orb">
                <div class="orb-inner">CHINU</div>
            </div>
            <div id="status" class="status-text">TAP ORB TO SPEAK</div>
        </div>

        <!-- Chat Output -->
        <div id="chat-box" class="chat-box">
            <div class="msg chinu"><b>CHINU:</b> Hello! હું ચીનુ છું. બોલો, આજે શું કામ કરું?</div>
        </div>

        <!-- Bottom Controls -->
        <div class="controls">
            <button id="flash-btn" class="icon-btn">🔦</button>
            <input id="user-input" type="text" placeholder="Ask CHINU anything...">
            <button id="send-btn" class="icon-btn">➤</button>
            <button id="mic-btn" class="icon-btn mic">🎙️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
