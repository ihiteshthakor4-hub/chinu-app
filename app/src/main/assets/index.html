<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CHINU OS v4.0</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .settings-btn {
            background: rgba(255, 42, 85, 0.2);
            border: 1px solid rgba(255, 42, 85, 0.5);
            color: #fff;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 14px;
            cursor: pointer;
            margin-left: 6px;
        }
        .chat-box {
            max-height: 185px;
            overflow-y: auto;
            text-align: left;
        }
        pre {
            background: #000;
            color: #00ff88;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 8px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        .copy-btn {
            margin-top: 6px;
            padding: 6px 12px;
            background: #ff2a55;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-box {
            width: 88%;
            max-width: 360px;
            background: #12060a;
            border: 1px solid #ff2a55;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .modal-box h3 { color: #ff2a55; margin-bottom: 10px; }
        .modal-box p { font-size: 12px; color: #ccc; margin-bottom: 12px; }
        .modal-box input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff2a55;
            background: #000;
            color: #fff;
            margin-bottom: 12px;
            outline: none;
        }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .modal-btns button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-save { background: #ff2a55; color: #fff; }
        .btn-close { background: #333; color: #fff; }
        .btn-extra {
            background: #220b14;
            color: #ff88a0;
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff2a55;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <span class="dot"></span>
                <span>CHINU OS <small>v4.0</small></span>
                <button class="settings-btn" onclick="openSettings()">⚙️</button>
                <button id="wake-btn" class="settings-btn" onclick="toggleWakeWord()">🎙️ OFF</button>
            </div>
            <div class="clock-box">
                <div id="time">00:00:00</div>
                <div id="date">LOADING...</div>
            </div>
        </div>

        <!-- Status Cards -->
        <div class="stats">
            <div class="card">
                <div class="label">BATTERY</div>
                <div id="battery" class="val">--%</div>
            </div>
            <div class="card">
                <div class="label">STATUS</div>
                <div class="val green">ONLINE</div>
            </div>
            <div class="card">
                <div class="label">VOICE CORE</div>
                <div class="val">FEMALE</div>
            </div>
        </div>

        <!-- Center Siri / CHINU Orb -->
        <div class="orb-section">
            <div id="orb" class="orb" onclick="startVoice()">
                <div class="orb-inner">CHINU</div>
            </div>
            <div id="status" class="status-text">TAP ORB TO START</div>
        </div>

        <!-- Chat Output -->
        <div id="chat-box" class="chat-box">
            <div class="msg chinu"><b>CHINU:</b> હાય બોસ! હું તમારી ચીનુ છું. બોલો, આજે શું કામ કરું?</div>
        </div>

        <!-- Bottom Controls -->
        <div class="controls">
            <button id="flash-btn" class="icon-btn" onclick="handleCommand('flashlight')">🔦</button>
            <input id="user-input" type="text" placeholder="Ask CHINU anything..." onkeypress="if(event.key==='Enter') sendText()">
            <button id="send-btn" class="icon-btn" onclick="sendText()">➤</button>
            <button id="mic-btn" class="icon-btn mic" onclick="startVoice()">🎙️</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-box">
            <h3>CHINU AI SETTINGS</h3>
            <p>Smart AI + Coding mode mate tamari Free Gemini API Key paste karo:</p>
            <input id="api-key-input" type="text" placeholder="Paste Gemini API Key here...">
            <div class="modal-btns">
                <button class="btn-save" onclick="saveApiKey()">SAVE</button>
                <button class="btn-close" onclick="closeSettings()">CLOSE</button>
            </div>
            <button class="btn-extra" onclick="openAccess()">🔧 AUTO-SCROLL & LOCK PERMISSION</button>
            <button class="btn-extra" onclick="clearHistory()">🗑️ CLEAR CHAT HISTORY</button>
        </div>
    </div>

    <script>
        var lastCodeText = "";
        var wakeActive = false;
        var chatHistory = [];
        try {
            var saved = localStorage.getItem("chinu_history");
            if (saved) chatHistory = JSON.parse(saved);
        } catch (e) { chatHistory = []; }

        function updateClock() {
            var now = new Date();
            var timeEl = document.getElementById("time");
            var dateEl = document.getElementById("date");
            if (timeEl) timeEl.textContent = now.toTimeString().split(" ")[0];
            if (dateEl) dateEl.textContent = now.toDateString().toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        if (navigator.getBattery) {
            navigator.getBattery().then(function(b) {
                var batEl = document.getElementById("battery");
                function updateBat() { if (batEl) batEl.textContent = Math.round(b.level * 100) + "%"; }
                updateBat();
                b.addEventListener("levelchange", updateBat);
            });
        }

        function toggleWakeWord() {
            wakeActive = !wakeActive;
            var btn = document.getElementById("wake-btn");
            var st = document.getElementById("status");
            if (btn) btn.textContent = wakeActive ? "🎙️ ON" : "🎙️ OFF";
            if (st) st.textContent = wakeActive ? "SAY 'HEY CHINU'..." : "TAP ORB TO START";
            if (window.Android && Android.setWakeWordMode) {
                Android.setWakeWordMode(wakeActive);
            }
        }

        function openSettings() {
            var modal = document.getElementById("settings-modal");
            var inp = document.getElementById("api-key-input");
            if (inp) inp.value = localStorage.getItem("chinu_api_key") || "";
            if (modal) modal.style.display = "flex";
        }

        function closeSettings() {
            var modal = document.getElementById("settings-modal");
            if (modal) modal.style.display = "none";
        }

        function saveApiKey() {
            var inp = document.getElementById("api-key-input");
            if (inp) {
                localStorage.setItem("chinu_api_key", inp.value.trim());
                closeSettings();
                showReply("API Key સેવ થઈ ગઈ બોસ! હવે હું પૂરી રીતે તૈયાર છું.", "gu");
            }
        }

        function openAccess() {
            closeSettings();
            if (window.Android && Android.openAccessibilitySettings) {
                Android.openAccessibilitySettings();
            }
        }

        function clearHistory() {
            chatHistory = [];
            localStorage.removeItem("chinu_history");
            closeSettings();
            showReply("જૂની ચેટ હિસ્ટ્રી ક્લીયર કરી દીધી છે બોસ.", "gu");
        }

        function copyCode() {
            if (!lastCodeText) return;
            var ta = document.createElement("textarea");
            ta.value = lastCodeText;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showReply("કોડ કોપી થઈ ગયો છે બોસ!", "gu");
        }

        function showReply(text, lang) {
            lang = lang || "gu";
            var chatBox = document.getElementById("chat-box");
            if (chatBox) {
                chatBox.innerHTML = '<div class="msg chinu"><b>CHINU:</b> ' + text + '</div>';
            }
            if (window.Android && Android.speak) {
                Android.speak(text, lang);
            }
        }

        function isHindi(cmd) {
            var hindiWords = ["kaise", "kaisi", "kya", "batao", "kholo", "karo", "tum", "tumhara", "mera", "samay", "kitne", "baje", "hindi", "shukriya", "thak gaya", "udas", "bhejo", "chalao", "kyun", "kahan", "mujhe", "pyar"];
            for (var i = 0; i < hindiWords.length; i++) {
                if (cmd.indexOf(hindiWords[i]) !== -1) return true;
            }
            return false;
        }

        window.onListeningStart = function() {
            var st = document.getElementById("status");
            var orb = document.getElementById("orb");
            if (st) st.textContent = "LISTENING...";
            if (orb) orb.classList.add("listening");
        };

        window.onListeningEnd = function() {
            var st = document.getElementById("status");
            var orb = document.getElementById("orb");
            if (st) st.textContent = wakeActive ? "SAY 'HEY CHINU'..." : "TAP ORB TO START";
            if (orb) orb.classList.remove("listening");
        };

        window.onVoiceResult = function(spokenText) {
            handleCommand(spokenText);
        };

        function startVoice() {
            if (window.Android && Android.startListening) {
                Android.startListening();
            }
        }

        function sendText() {
            var input = document.getElementById("user-input");
            if (input && input.value.trim() !== "") {
                handleCommand(input.value);
                input.value = "";
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function askGeminiAI(userText, hi) {
            var apiKey = localStorage.getItem("chinu_api_key");
            if (!apiKey) {
                if (hi) showReply("बॉस, ऊपर सेटिंग्स बटन दबाकर फ्री जेमिनी एपीआई की डाल दो।", "hi");
                else showReply("બોસ, ઉપર સેટિંગ્સ બટન દબાવીને ફ્રી જેમિની એપીઆઈ કી નાખી દો.", "gu");
                return;
            }

            var st = document.getElementById("status");
            var orb = document.getElementById("orb");
            if (st) st.textContent = "THINKING...";
            if (orb) orb.classList.add("siri-glow");

            chatHistory.push({ role: "user", parts: [{ text: userText }] });
            if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

            var payload = {
                system_instruction: {
                    parts: [{
                        text: "You are CHINU, a deeply caring, emotionally warm, playful, and motivating 22-year-old companion and expert programmer. Always address the user affectionately as 'બોસ' (Boss) in Gujarati or 'बॉस' (Boss) in Hindi. Never sound robotic. Care about the user's mood, motivate them when they feel tired or stressed, and talk naturally like a real human in pure Gujarati script if the user speaks Gujarati, or pure Hindi script if the user speaks Hindi. Keep normal chat natural and short (1 to 3 sentences). Never use emojis or asterisks in normal chat. If the user asks for deep analysis or coding, give clear helpful answers and put code inside triple backticks."
                    }]
                },
                contents: chatHistory
            };

            fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + apiKey, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (st) st.textContent = wakeActive ? "SAY 'HEY CHINU'..." : "TAP ORB TO START";
                if (orb) orb.classList.remove("siri-glow");

                if (data && data.candidates && data.candidates[0] && data.candidates[0].content) {
                    var reply = data.candidates[0].content.parts[0].text.trim();
                    chatHistory.push({ role: "model", parts: [{ text: reply }] });
                    try { localStorage.setItem("chinu_history", JSON.stringify(chatHistory)); } catch (e) {}

                    var isReplyHindi = /[\u0900-\u097F]/.test(reply);
                    var codeMatch = reply.match(/```[a-zA-Z]*\n?([\s\S]*?)```/);
                    if (codeMatch) {
                        lastCodeText = codeMatch[1].trim();
                        var chatBox = document.getElementById("chat-box");
                        if (chatBox) {
                            chatBox.innerHTML = '<div class="msg chinu"><b>CHINU:</b> આ રહ્યો તમારો કોડ બોસ:<pre>' + escapeHtml(lastCodeText) + '</pre><button class="copy-btn" onclick="copyCode()">📋 COPY CODE</button></div>';
                        }
                        if (window.Android && Android.speak) {
                            Android.speak(isReplyHindi ? "बॉस, मैंने कोड लिख दिया है। स्क्रीन पर देख लो और कॉपी कर लो।" : "બોસ, મેં તમારા માટે કોડ લખી દીધો છે. સ્ક્રીન પર જોઈને કોપી કરી લો.", isReplyHindi ? "hi" : "gu");
                        }
                    } else {
                        showReply(reply.replace(/\*/g, ""), isReplyHindi ? "hi" : "gu");
                    }
                } else {
                    chatHistory.pop();
                    var err = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
                    showReply("API Error: " + err, "en");
                }
            })
            .catch(function(e) {
                chatHistory.pop();
                if (st) st.textContent = wakeActive ? "SAY 'HEY CHINU'..." : "TAP ORB TO START";
                if (orb) orb.classList.remove("siri-glow");
                showReply("Network Error: " + e.message, "en");
            });
        }

        function handleCommand(rawText) {
            var cmd = rawText.trim().toLowerCase();
            if (!cmd) return;
            var hi = isHindi(cmd);
            var orb = document.getElementById("orb");

            // 0. Hey Chinu + Siri Glow
            if (cmd === "hey chinu" || cmd === "chinu" || cmd === "hi chinu") {
                if (orb) {
                    orb.classList.add("siri-glow");
                    setTimeout(function() { orb.classList.remove("siri-glow"); }, 3500);
                }
                if (hi) showReply("हाँ बॉस, बोलो मैं सुन रही हूँ।", "hi");
                else showReply("હા બોસ, બોલો હું સાંભળી રહી છું.", "gu");
                return;
            }

            // 1. Lock Screen
            if (cmd.indexOf("lock screen") !== -1 || cmd.indexOf("phone lock") !== -1 || cmd === "lock") {
                var locked = window.Android && Android.lockScreen && Android.lockScreen();
                if (!locked) showReply("પહેલા સેટિંગ્સમાં જઈને CHINU Control પરમિશન ચાલુ કરો બોસ.", "gu");
                return;
            }

            // 2. Screenshot
            if (cmd.indexOf("screenshot") !== -1 || cmd.indexOf("screen shot") !== -1) {
                var shot = window.Android && Android.takeScreenshot && Android.takeScreenshot();
                if (shot) showReply("સ્ક્રીનશોટ લઈ લીધો બોસ.", "gu");
                else showReply("પહેલા સેટિંગ્સમાં જઈને CHINU Control પરમિશન ચાલુ કરો બોસ.", "gu");
                return;
            }

            // 3. Volume Control
            if (cmd.indexOf("volume") !== -1 || cmd.indexOf("awaj") !== -1 || cmd.indexOf("sound") !== -1 || cmd === "mute") {
                if (window.Android && Android.controlVolume) {
                    if (cmd.indexOf("mute") !== -1 || cmd.indexOf("bandh") !== -1 || cmd.indexOf("zero") !== -1) {
                        Android.controlVolume("mute");
                        showReply("ફોન મ્યૂટ કરી દીધો બોસ.", "gu");
                    } else if (cmd.indexOf("full") !== -1 || cmd.indexOf("max") !== -1) {
                        Android.controlVolume("max");
                        showReply("અવાજ ફૂલ કરી દીધો બોસ.", "gu");
                    } else if (cmd.indexOf("down") !== -1 || cmd.indexOf("kam") !== -1 || cmd.indexOf("ochho") !== -1 || cmd.indexOf("ghatad") !== -1) {
                        Android.controlVolume("down");
                        showReply("અવાજ ઓછો કર્યો બોસ.", "gu");
                    } else {
                        Android.controlVolume("up");
                        showReply("અવાજ વધાર્યો બોસ.", "gu");
                    }
                    return;
                }
            }

            // 4. Brightness Control
            if (cmd.indexOf("brightness") !== -1) {
                if (window.Android && Android.setBrightness) {
                    var level = 140;
                    if (cmd.indexOf("full") !== -1 || cmd.indexOf("high") !== -1 || cmd.indexOf("max") !== -1 || cmd.indexOf("vadhar") !== -1) level = 255;
                    else if (cmd.indexOf("low") !== -1 || cmd.indexOf("kam") !== -1 || cmd.indexOf("ochhi") !== -1 || cmd.indexOf("down") !== -1) level = 35;
                    var okB = Android.setBrightness(level);
                    if (okB) showReply("બ્રાઈટનેસ સેટ કરી દીધી બોસ.", "gu");
                    else showReply("બ્રાઈટનેસ બદલવા માટે Modify System Settings પરમિશન ચાલુ કરી દો બોસ.", "gu");
                    return;
                }
            }

            // 5. Set Alarm (e.g. "set alarm for 6:30" or "alarm 7")
            if (cmd.indexOf("alarm") !== -1) {
                var timeMatch = cmd.match(/(\d{1,2})(?::(\d{2}))?/);
                if (timeMatch && window.Android && Android.setAlarm) {
                    var hr = parseInt(timeMatch[1], 10);
                    var min = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
                    if ((cmd.indexOf("pm") !== -1 || cmd.indexOf("shaam") !== -1 || cmd.indexOf("raat") !== -1) && hr < 12) hr += 12;
                    Android.setAlarm(hr, min, "CHINU Alarm");
                    showReply(hr + ":" + (min < 10 ? "0" + min : min) + " નો અલાર્મ સેટ કરી દીધો બોસ.", "gu");
                    return;
                }
            }

            // 6. Set Timer (e.g. "set timer 5 minutes" or "timer 30 seconds")
            if (cmd.indexOf("timer") !== -1) {
                var numMatch = cmd.match(/(\d+)/);
                if (numMatch && window.Android && Android.setTimer) {
                    var val = parseInt(numMatch[1], 10);
                    var secs = (cmd.indexOf("sec") !== -1) ? val : (val * 60);
                    Android.setTimer(secs, "CHINU Timer");
                    showReply(val + (cmd.indexOf("sec") !== -1 ? " સેકન્ડનો" : " મિનિટનો") + " ટાઈમર ચાલુ કરી દીધો બોસ.", "gu");
                    return;
                }
            }

            // 7. Spotify Music
            if (cmd.indexOf("spotify") !== -1) {
                var song = cmd.replace(/spotify|par|ma|on|play|vagaad|chalao|open|song|songs/g, "").trim();
                if (song && window.Android && Android.playSpotify) {
                    showReply("સ્પોટિફાય પર " + song + " વગાડું છું બોસ.", "gu");
                    Android.playSpotify(song);
                    return;
                }
            }

            // 8. Wi-Fi & Bluetooth
            if (cmd.indexOf("wifi") !== -1 || cmd.indexOf("wi-fi") !== -1) {
                if (window.Android && Android.openWifiPanel) {
                    showReply("વાઇ-ફાઇ પેનલ ખોલી દીધી છે બોસ.", "gu");
                    Android.openWifiPanel();
                    return;
                }
            }
            if (cmd.indexOf("bluetooth") !== -1) {
                if (window.Android && Android.openBluetoothSettings) {
                    showReply("બ્લૂટૂથ સેટિંગ્સ ખોલી દીધું છે બોસ.", "gu");
                    Android.openBluetoothSettings();
                    return;
                }
            }

            // 9. Scroll / Back / Home
            if (cmd.indexOf("scroll down") !== -1 || cmd.indexOf("niche scroll") !== -1 || cmd.indexOf("niche kar") !== -1) {
                var okDown = window.Android && Android.scrollDown && Android.scrollDown();
                if (!okDown) showReply("પહેલા સેટિંગ્સમાં જઈને CHINU Control પરમિશન ચાલુ કરો બોસ.", "gu");
                return;
            }
            if (cmd.indexOf("scroll up") !== -1 || cmd.indexOf("upar scroll") !== -1 || cmd.indexOf("upar kar") !== -1) {
                var okUp = window.Android && Android.scrollUp && Android.scrollUp();
                if (!okUp) showReply("પહેલા સેટિંગ્સમાં જઈને CHINU Control પરમિશન ચાલુ કરો બોસ.", "gu");
                return;
            }
            if (cmd === "go back" || cmd === "back" || cmd.indexOf("pachhal") !== -1) {
                if (window.Android && Android.goBack) Android.goBack();
                return;
            }
            if (cmd === "go home" || cmd === "home screen") {
                if (window.Android && Android.goHome) Android.goHome();
                return;
            }

            // 10. YouTube Search
            if (cmd.indexOf("youtube") !== -1 && (cmd.indexOf("search") !== -1 || cmd.indexOf("play") !== -1 || cmd.indexOf("chalav") !== -1 || cmd.indexOf("chalao") !== -1 || cmd.indexOf("par ") !== -1 || cmd.indexOf("ma ") !== -1)) {
                var q = cmd.replace(/youtube|par|ma|on|search|kar|karo|play|chalav|chalao/g, "").trim();
                if (q && window.Android && Android.searchYouTube) {
                    showReply("યુટ્યુબ પર " + q + " સર્ચ કરી રહી છું બોસ.", "gu");
                    Android.searchYouTube(q);
                    return;
                }
            }

            // 11. WhatsApp Message
            if ((cmd.indexOf("whatsapp") !== -1 && (cmd.indexOf("message") !== -1 || cmd.indexOf("msg") !== -1 || cmd.indexOf("mokal") !== -1 || cmd.indexOf("bhejo") !== -1)) || cmd.indexOf("message ") === 0 || cmd.indexOf("msg ") === 0) {
                var msg = rawText.replace(/whatsapp|message|msg|par|ma|mokal|bhejo|send|kar|karo/gi, "").trim();
